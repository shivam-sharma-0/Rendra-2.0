# Adopt the existing development Hibernate schema once, then migrate before Hibernate validates.
# Empty databases still run V1 onward. Do not use this profile to baseline a partial/shared schema.
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 16
  jpa:
    hibernate:
      ddl-auto: validate

# Explicit operator opt-in for the owner's single-tenant dev box. Never use this profile on a shared/public server.
# Set the environment override to false to keep the development profile default-deny as well.
codepal:
  supabase:
    self-hosted:
      operator-sql-enabled: ${CODEPAL_SUPABASE_SELF_HOSTED_OPERATOR_SQL_ENABLED:true}
