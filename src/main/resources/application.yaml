server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Code-Pal

  # Local secrets (gitignored)
  # Loaded from .secrets/secrets.properties regardless of shell/IDE env, so a restart always picks up
  # secrets (GOOGLE_CLIENT_SECRET, NVIDIA_API_KEY, AGENT_LLM_API_KEY). Both candidate working directories are tried;
  # each is optional. Deployment injects the same keys from its own env/secret manager instead.
  config:
    import:
      - optional:file:./.secrets/secrets.properties
      - optional:file:./Code-Pal/.secrets/secrets.properties

  # PostgreSQL 
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:codepal}?TimeZone=UTC
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:replace-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  # Redis (cross-instance realtime Pub/Sub fan-out) 
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/codepal}
    database: ${MONGO_DATABASE:codepal}

  #  JPA / Hibernate 
  jpa:
    hibernate:
      # Hibernate only VALIDATES the schema against the entities; it never mutates it. The schema is
      # owned by Flyway (enable with FLYWAY_ENABLED=true). Never set this to create/update in any
      # shared environment — it would fight Flyway and risk data loss.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false         # avoid lazy-loading in the view layer; keep tx boundaries in services
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # â”€â”€ Flyway (versioned schema migrations) 
  # Disabled in dev because ddl-auto=create already rebuilds the schema from the entities (so new
  # columns/constraints appear automatically). The V1/V2 migrations are kept for prod: set
  # ddl-auto=validate and FLYWAY_ENABLED=true, and Flyway will own the versioned schema instead.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Adopt existing Hibernate-managed schema"

  #  OAuth2 login (Google) 
  # client-id is a public identifier (safe to default); the SECRET is env-only â€” never
  # commit it. Rotate any secret that has ever been pasted into source control.
  security:
    oauth2:
      client:
        registration:
          google:
            # client-id is public (appears in the browser during the OAuth flow) â†’ safe to default.
            client-id: ${GOOGLE_CLIENT_ID:350758092723-d1kgrbg01mtmgve9ujrfo3kq4ffiidd1.apps.googleusercontent.com}
            # SECRET â€” env-only, no default. Set GOOGLE_CLIENT_SECRET from a secret manager.
            # (A previously committed value has been removed; rotate it in the Google console.)
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [ email, profile ]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

# JWT (RS256, asymmetric)
# Only this service holds the private key (signs tokens); any other service verifies
# with the public key alone â€” so a future microservice split needs no shared secret.
jwt:
  access-expiry: ${JWT_ACCESS_EXPIRY:900000}      # 15 minutes (ms)
  refresh-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days (ms)
  rsa:
    # Both keys must be mounted/injected outside source control, for example:
    # file:/run/secrets/codepal-jwt-private.pem
    # local: resolves ignored development keys from either supported IDE working directory.
    # Deployment always overrides these with JWT_PRIVATE_KEY and JWT_PUBLIC_KEY from its secret manager.
    private-key: ${JWT_PRIVATE_KEY:local:jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY:local:jwt-public.pem}

# App / OAuth redirect 
# After a successful Google login the backend mints our own JWTs and redirects the
# browser back to the SPA here (tokens appended as query params). Point this at the
# frontend origin/route. Only these exact URLs are honoured (open-redirect guard).
app:
  auth:
    # Set COOKIE_SECURE=true in every HTTPS deployment. Local HTTP development may opt into false.
    cookie-secure: ${COOKIE_SECURE:false}

  # CORS 
  # Browser origins allowed to call the REST API and open the WebSocket. Credentials are enabled
  # (refresh cookie), so origins must be explicit â€” no wildcard. Comma-separated for multiple.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Rate limiting (auth endpoints)
  # Redis fixed-window limiter guarding login/signup/refresh against brute force. Fail-open if Redis
  # is unavailable, so a limiter outage never blocks sign-in.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:20}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}

  # User-generated sites (agent previews /preview/** and published projects /p/**)
  # Untrusted generated code must never run on the API origin, so these are served ONLY from this
  # separate origin (the API origin redirects them here). It must differ from the API by HOST —
  # cookies ignore ports. Dev: 127.0.0.1 vs localhost. Production: a dedicated domain, never a
  # subdomain sharing cookies with the API; behind a proxy set server.forward-headers-strategy.
  sites:
    base-url: ${APP_SITES_BASE_URL:http://127.0.0.1:8080}
    # Host per site: <slug>.<domain> (published), pv--<key>.<domain> (private preview), dr--<key>.<domain>
    # (draft). Each site then runs at the root of its own origin, so client-side routing and absolute paths
    # work and projects cannot read each other's storage. Browsers resolve *.localhost to this machine.
    # Production: a wildcard DNS record + certificate for a domain on the public suffix list. Empty =
    # sites under paths of base-url (/preview/<token>/, /p/<slug>/).
    wildcard-domain: ${APP_SITES_WILDCARD_DOMAIN:sites.localhost}
  # Encrypts secrets stored in the database (Supabase access tokens). Without it they cannot be stored.
  data-key: ${APP_DATA_KEY:}
  supabase:
    api-url: ${SUPABASE_API_URL:https://api.supabase.com}
    # A Supabase instance this server runs (local CLI stack or self-hosted). Projects connect to it by
    # this URL; approved migrations run over db-url. Blank: only supabase.co projects can be connected.
    self-hosted:
      url: ${SUPABASE_SELF_HOSTED_URL:}
      db-url: ${SUPABASE_SELF_HOSTED_DB_URL:}
      db-user: ${SUPABASE_SELF_HOSTED_DB_USER:postgres}
      db-password: ${SUPABASE_SELF_HOSTED_DB_PASSWORD:}

  oauth2:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:5173/oauth/callback}

  # Agent (LLM coding agent) 
  # LLM providers are OpenAI-compatible. NVIDIA and Groq are the active model pool;
  # OpenRouter remains available as a fallback provider.
  # api-key is a SECRET â†’ env-only, no default. All models below must support tool/function calling.
  agent:
    billing-mode: ${BILLING_MODE:FREE}
    llm:
      base-url: ${AGENT_LLM_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${AGENT_LLM_API_KEY:}
      temperature: 0.2
      request-timeout-ms: ${AGENT_LLM_REQUEST_TIMEOUT_MS:60000}
      max-attempts: ${AGENT_LLM_MAX_ATTEMPTS:3}
      retry-initial-backoff-ms: ${AGENT_LLM_RETRY_INITIAL_BACKOFF_MS:500}
      retry-max-backoff-ms: ${AGENT_LLM_RETRY_MAX_BACKOFF_MS:5000}
      # A streamed response silent for this long counts as dead (request-timeout covers headers only).
      stream-idle-timeout-ms: ${AGENT_LLM_STREAM_IDLE_TIMEOUT_MS:60000}
      # Max wall-clock for one agent model call, retries included; then the next model is tried.
      call-budget-ms: ${AGENT_LLM_CALL_BUDGET_MS:90000}
      # A model whose call just failed is skipped for this long while another model is available.
      provider-cooldown-ms: ${AGENT_LLM_PROVIDER_COOLDOWN_MS:60000}
    # Provider-specific OpenAI-compatible endpoints. The model routes below are selected one at a
    # time in round-robin order; no LLM requests from a single run are sent in parallel.
    providers:
      openrouter:
        base-url: https://openrouter.ai/api
        api-key: "${OPENROUTER_API_KEY:ENC(ODRpA4R7z06IJp5+fqmyq1IV/+O+kautoPWZcfGF0JCDlfoGXY5emiIunTKCcqtjdUA9uhk7LWmWI8x/zUcgLZ/6LOE9x9L1cu2DrwxmB4FqPbdtWWPoayRzbgZPYlScvutfMjsZC8ftRmQIPoSjsDzF3CsT)}"
      nvidia:
        base-url: https://integrate.api.nvidia.com/v1
        api-key: "${NVIDIA_API_KEY:ENC(8dINy2ixZDjWRMercsQO/Qd/IEOhslBfiNQKhj1k39dubWqaO/862av6XBTgrS7JCYS6bC97z706GHNmg9ezchKqe9f1TNOc1wu/3eUNNxgxWZNZaYtLd9pKVWIVD/fBltsJyemG3ugbYE3yqpX5Xasu)}"
      groq:
        base-url: https://api.groq.com/openai/v1
        api-key: "${GROQ_API_KEY:ENC(FVtXcOR9KiLqYfWfwMmEWwVb8vpb6reZrzhbpvjM3wcM7bElRhBtYpqws9h0mWsUQhuyB0neKR47NR+EGstbvzu937AkTcmj/T73l5cQ4jvvGHobw5n/hX6uEGEnX5elC35Xng==)}"
      mistral:
        base-url: https://api.mistral.ai/v1
        api-keys:
          - "ENC(ab12idRQXOKSeGMKhl4JVl80AsLanrqSlmqOzzVCOeVfMhCCqoR/iZP8gxrByzlssIzCd6lGD28O3leXCfQvjCPepiwl+MIcpc+uFaD4Oj+mv3XU5WdCNo0=)"
          - "ENC(LbPmq4zfPSXQf33Y1UnATNiCQPkljFcAWdcNOSVGgr1D3G64ilY4c3kpnVloWpWKXBEkkEMx21Ud43IGKfACzGZC7hnNwa9pZMFos1Yf0N/IZTDiZl6+JxI=)"
          - "ENC(PnE1LPdnJibNwj6t82QuqViYVNmNxmeOd8fpL3soirZH7elpFWeXI5jQKASIPUmpfZk95KUhCq6kj6ASqbY0aLZP3+QKtjmU8m1akqPHCJI/YTOOcio9qcQ=)"
      gemini:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: "ENC(2V/vTEVbYL1gbhB+7hORs0z90oAuYRQtz9vN2ztTjI7bbtYxY+R6jfgEUAjaPakvO9YHeqgQqYb4WodtcmSJCVMbK5PURRgpyTxymuaDZkf1EqzcCT2T8RxbqnA2JKBorA==)"
    # Only chat-generation models are included. Prompt-guard, safeguard, speech-to-text and
    # text-to-speech models are intentionally excluded from the software agent pool.
    models:
      # Only software-agent models are used: coding, planning, reasoning and fast code iteration.
      # Safety, embedding, vision, speech, structured-data and unrelated general models are excluded.
      build: "${AGENT_MODEL_BUILD:nvidia:nvidia/nemotron-3-ultra-550b-a55b,groq:openai/gpt-oss-120b,nvidia:nvidia/nemotron-3-super-120b-a12b,groq:qwen/qwen3.8-27b}"
      chat: "${AGENT_MODEL_CHAT:groq:openai/gpt-oss-20b,groq:qwen/qwen3.8-27b,nvidia:deepseek-ai/deepseek-v4.1-flash}"
      plan: "${AGENT_MODEL_PLAN:nvidia:nvidia/nemotron-3-super-120b-a12b,groq:openai/gpt-oss-120b,groq:openai/gpt-oss-20b,nvidia:deepseek-ai/deepseek-v4.1-flash}"
      free-build: "mistral:codestral-latest,mistral:mistral-medium-latest,groq:openai/gpt-oss-120b,nvidia:nvidia/nemotron-3-super-120b-a12b"
      free-chat: "mistral:mistral-small-latest,groq:openai/gpt-oss-20b,groq:qwen/qwen3.8-27b,nvidia:deepseek-ai/deepseek-v4.1-flash"
      free-plan: "mistral:magistral-medium-latest,mistral:mistral-medium-latest,groq:openai/gpt-oss-120b,nvidia:deepseek-ai/deepseek-v4.1-flash"
      # Reads attached images (screenshots, designs) into a text brief for the coding model; in order.
      vision: "${AGENT_MODEL_VISION:nvidia:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning,nvidia:meta/llama-3.2-11b-vision-instruct}"
    # Per-project code lives here (one dir per project).
    workspace-base-path: ${AGENT_WORKSPACE_PATH:./workspaces}
    # Safety limits for a single run.
    # A fresh app (plan, ~10 files, type-check, build, one repair) needs ~30 turns with free models.
    max-iterations: ${AGENT_MAX_ITERATIONS:40}
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:40}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:100}
    # Per-user guards so one account cannot exhaust the shared LLM quota (0 disables a check).
    limits:
      turns-per-minute: ${AGENT_LIMIT_TURNS_PER_MINUTE:10}
      max-active-runs-per-user: ${AGENT_LIMIT_MAX_ACTIVE_RUNS:2}
      daily-token-quota: ${AGENT_LIMIT_DAILY_TOKENS:2000000}
    context-budget-chars: ${AGENT_CONTEXT_BUDGET_CHARS:80000}
    project-map-budget-chars: ${AGENT_PROJECT_MAP_BUDGET_CHARS:18000}
    conversation-budget-chars: ${AGENT_CONVERSATION_BUDGET_CHARS:20000}
    project-scan-max-files: ${AGENT_PROJECT_SCAN_MAX_FILES:5000}
    project-scan-max-depth: ${AGENT_PROJECT_SCAN_MAX_DEPTH:12}
    project-instruction-max-chars: ${AGENT_PROJECT_INSTRUCTION_MAX_CHARS:4000}
    run-timeout-ms: ${AGENT_RUN_TIMEOUT_MS:300000}
    worker-concurrency: ${AGENT_WORKER_CONCURRENCY:2}
    tool-concurrency: ${AGENT_TOOL_CONCURRENCY:4}
    stream-batch-chars: ${AGENT_STREAM_BATCH_CHARS:96}
    stream-batch-interval-ms: ${AGENT_STREAM_BATCH_INTERVAL_MS:250}
    stream-persist-chars: ${AGENT_STREAM_PERSIST_CHARS:4000}
    stream-persist-interval-ms: ${AGENT_STREAM_PERSIST_INTERVAL_MS:3000}
    stale-sweep-interval-ms: ${AGENT_STALE_SWEEP_INTERVAL_MS:30000}
    # A QUEUED run untouched this long is requeued (its Redis enqueue was probably lost).
    queued-recovery-ms: ${AGENT_QUEUED_RECOVERY_MS:60000}
    heartbeat-interval-ms: ${AGENT_HEARTBEAT_INTERVAL_MS:15000}
    rollback-on-failure: ${AGENT_ROLLBACK_ON_FAILURE:true}
    max-repair-attempts: ${AGENT_MAX_REPAIR_ATTEMPTS:3}
    max-validation-diagnostics: ${AGENT_MAX_VALIDATION_DIAGNOSTICS:40}
    sandbox:
      required: ${AGENT_SANDBOX_REQUIRED:true}
      # Without the sandbox, generated code runs on this host. Startup fails unless this is true
      # (local development only).
      allow-host-execution: ${AGENT_SANDBOX_ALLOW_HOST_EXECUTION:false}
      docker-command: ${AGENT_SANDBOX_DOCKER_COMMAND:wsl.exe}
      docker-command-args: ${AGENT_SANDBOX_DOCKER_COMMAND_ARGS:-e docker}
      image: ${AGENT_SANDBOX_IMAGE:node:22-bookworm-slim}
      # "none": generated code gets no network while validated; older containers are recreated.
      network: ${AGENT_SANDBOX_NETWORK:none}
      container-prefix: ${AGENT_SANDBOX_CONTAINER_PREFIX:codepal-sandbox-}
      # Project files live in <workspace-base-path>/<projectId> and are bind-mounted into the
      # container. Blank derives the Docker-side path from workspace-base-path (WSL share or Linux).
      host-workspace-path: ${AGENT_SANDBOX_HOST_WORKSPACE_PATH:}
      # Container user; must match the owner of the files the backend writes (WSL default user).
      user: ${AGENT_SANDBOX_USER:1000:1000}
      workspace-path: ${AGENT_SANDBOX_WORKSPACE_PATH:/workspace}
      command-timeout-ms: ${AGENT_SANDBOX_COMMAND_TIMEOUT_MS:120000}
      output-max-chars: ${AGENT_SANDBOX_OUTPUT_MAX_CHARS:80000}
      memory-mb: ${AGENT_SANDBOX_MEMORY_MB:2048}
      cpus: ${AGENT_SANDBOX_CPUS:2.0}
      idle-stop-ms: ${AGENT_SANDBOX_IDLE_STOP_MS:900000}
      idle-remove-ms: ${AGENT_SANDBOX_IDLE_REMOVE_MS:86400000}
      cleanup-interval-ms: ${AGENT_SANDBOX_CLEANUP_INTERVAL_MS:60000}
      max-project-bytes: ${AGENT_SANDBOX_MAX_PROJECT_BYTES:500000000}
      # Dependency installs run in a separate short-lived container: the only sandbox step with a
      # network, and package lifecycle scripts are disabled (npm --ignore-scripts).
      install-network: ${AGENT_SANDBOX_INSTALL_NETWORK:bridge}
      install-timeout-ms: ${AGENT_SANDBOX_INSTALL_TIMEOUT_MS:300000}
      max-dependency-bytes: ${AGENT_SANDBOX_MAX_DEPENDENCY_BYTES:1000000000}
      # Runtime check: the staged site is loaded in headless Chromium (no network) before commit.
      runtime-check: ${AGENT_SANDBOX_RUNTIME_CHECK:true}
      browser-image: ${AGENT_SANDBOX_BROWSER_IMAGE:codepal-browser}
      browser-timeout-ms: ${AGENT_SANDBOX_BROWSER_TIMEOUT_MS:60000}
      # Draft preview: staged changes are built for the preview while the agent works (0 = off).
      draft-preview-quiet-ms: ${AGENT_SANDBOX_DRAFT_PREVIEW_QUIET_MS:3000}

# Logging 
# Rolling file config (datewise folder -> hourwise files) lives in logback-spring.xml.
logging:
  level:
    '[com.code.pal]': ${LOG_LEVEL:INFO}
    '[org.springframework.security]': WARN

# Actuator (observability)
# Only health/info/metrics/prometheus are exposed. /actuator/health is public (k8s probes);
# everything else stays behind authentication (see SecurityConfig). Health detail is shown only
# to authenticated callers so an anonymous probe can't enumerate component internals.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
